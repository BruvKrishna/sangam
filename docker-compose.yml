version: '3.8'

services:
  backend:
    build: ./backend
    container_name: sangam-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: always

  frontend:
    build: ./frontend
    container_name: sangam-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
